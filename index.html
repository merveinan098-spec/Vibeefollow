<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#050507" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="YAKIN" />
  <title>YAKIN</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-obsidian: #050507;
      --bg-surface: #0D0E12;
      --bg-elevated: #14161D;
      --bg-glass: rgba(18, 20, 28, 0.84);
      --gold: #E5C158;
      --gold-soft: rgba(229, 193, 88, 0.16);
      --gold-border: rgba(229, 193, 88, 0.34);
      --rose: #FF4769;
      --rose-soft: rgba(255, 71, 105, 0.16);
      --emerald: #34D399;
      --text-primary: #F7F5EE;
      --text-secondary: #A6A39B;
      --text-muted: #6C6962;
      --border-subtle: rgba(255, 255, 255, 0.08);
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg-obsidian);
      color: var(--text-primary);
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100dvh;
      overflow-x: hidden;
    }

    .font-serif-luxury {
      font-family: 'Cormorant Garamond', Georgia, serif;
    }

    .app-shell {
      max-width: 460px;
      margin: 0 auto;
      min-height: 100dvh;
      background:
        radial-gradient(circle at 50% -6%, rgba(229, 193, 88, 0.13), transparent 44%),
        radial-gradient(circle at 88% 18%, rgba(255, 71, 105, 0.08), transparent 36%),
        var(--bg-obsidian);
      position: relative;
      display: flex;
      flex-direction: column;
      padding-top: var(--safe-top);
      padding-bottom: calc(82px + var(--safe-bottom));
      border-left: 1px solid rgba(255, 255, 255, 0.04);
      border-right: 1px solid rgba(255, 255, 255, 0.04);
    }

    .top-header {
      position: sticky;
      top: 0;
      z-index: 30;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: rgba(5, 5, 7, 0.86);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-bottom: 1px solid var(--border-subtle);
    }

    .brand-title {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 0.14em;
      color: var(--gold);
      margin: 0;
      line-height: 1;
    }

    .brand-sub {
      font-size: 10px;
      color: var(--text-muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-top: 2px;
    }

    .icon-btn {
      width: 36px;
      height: 36px;
      border-radius: 999px;
      border: 1px solid var(--border-subtle);
      background: var(--bg-elevated);
      color: var(--text-primary);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      cursor: pointer;
      transition: transform 0.15s ease, border-color 0.15s ease, background 0.15s ease;
    }

    .icon-btn:active {
      transform: scale(0.95);
    }

    .icon-btn.gold {
      border-color: var(--gold-border);
      background: var(--gold-soft);
      color: var(--gold);
    }

    .icon-btn.rose {
      border-color: rgba(255, 71, 105, 0.36);
      background: var(--rose-soft);
      color: var(--rose);
    }

    .content-area {
      flex: 1;
      padding: 14px 14px 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 20px;
      padding: 14px;
    }

    .card.gold-ring {
      border-color: var(--gold-border);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    }

    .row-between {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .row-gap {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 11px;
      border-radius: 999px;
      font-size: 11.5px;
      font-weight: 600;
      border: 1px solid var(--border-subtle);
      background: var(--bg-elevated);
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .pill.active {
      border-color: var(--gold-border);
      background: var(--gold-soft);
      color: var(--gold);
    }

    .pill.rose.active {
      border-color: rgba(255, 71, 105, 0.42);
      background: var(--rose-soft);
      color: var(--rose);
    }

    .btn-gold {
      width: 100%;
      padding: 12px 16px;
      border-radius: 14px;
      border: 1px solid rgba(229, 193, 88, 0.55);
      background: linear-gradient(135deg, #F0D27A 0%, #D4AE43 100%);
      color: #08080A;
      font-weight: 700;
      font-size: 13.5px;
      cursor: pointer;
      transition: transform 0.15s ease;
    }

    .btn-gold:active {
      transform: scale(0.98);
    }

    .btn-ghost {
      padding: 10px 14px;
      border-radius: 12px;
      border: 1px solid var(--border-subtle);
      background: var(--bg-elevated);
      color: var(--text-primary);
      font-weight: 600;
      font-size: 12.5px;
      cursor: pointer;
    }

    .btn-rose {
      padding: 10px 14px;
      border-radius: 12px;
      border: 1px solid rgba(255, 71, 105, 0.4);
      background: var(--rose-soft);
      color: var(--rose);
      font-weight: 700;
      font-size: 12.5px;
      cursor: pointer;
    }

    .input, .textarea, .select {
      width: 100%;
      background: var(--bg-elevated);
      color: var(--text-primary);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 10px 12px;
      font-family: inherit;
      font-size: 13px;
      outline: none;
    }

    .input:focus, .textarea:focus, .select:focus {
      border-color: var(--gold-border);
    }

    .textarea {
      resize: vertical;
      min-height: 74px;
    }

    /* Stories */
    .stories-strip {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
    }

    .stories-strip::-webkit-scrollbar {
      display: none;
    }

    .story-item {
      flex: 0 0 auto;
      width: 72px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      text-align: center;
    }

    .story-ring {
      width: 64px;
      height: 64px;
      border-radius: 999px;
      padding: 2.5px;
      background: linear-gradient(135deg, var(--gold), var(--rose));
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .story-ring.h48 {
      background: linear-gradient(135deg, #7DD3FC, var(--gold));
    }

    .story-ring.locked {
      background: linear-gradient(135deg, #A78BFA, var(--gold));
    }

    .story-ring.add {
      background: transparent;
      border: 1.5px dashed var(--gold-border);
    }

    .story-inner {
      width: 100%;
      height: 100%;
      border-radius: 999px;
      background: var(--bg-surface);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 16px;
      color: var(--text-primary);
    }

    .story-badge {
      position: absolute;
      bottom: -2px;
      right: -2px;
      background: var(--bg-obsidian);
      border: 1px solid var(--gold-border);
      color: var(--gold);
      font-size: 9px;
      font-weight: 700;
      padding: 1px 5px;
      border-radius: 999px;
    }

    .story-name {
      font-size: 11px;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      width: 100%;
    }

    /* Profile cards & media */
    .visual-box {
      border-radius: 16px;
      padding: 18px;
      min-height: 170px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border: 1px solid rgba(255, 255, 255, 0.08);
      position: relative;
      overflow: hidden;
    }

    .media-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .media-tile {
      aspect-ratio: 4 / 5;
      border-radius: 12px;
      padding: 8px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border: 1px solid var(--border-subtle);
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }

    /* Camera studio */
    .viewfinder {
      position: relative;
      border-radius: 22px;
      min-height: 360px;
      background: #07080B;
      border: 1px solid var(--gold-border);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 12px;
    }

    .viewfinder-media {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: filter 0.25s ease, transform 0.25s ease;
    }

    .viewfinder-overlay {
      position: relative;
      z-index: 3;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 100%;
      gap: 10px;
    }

    .grid-overlay {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      background-image:
        linear-gradient(to right, rgba(255,255,255,0.14) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255,255,255,0.14) 1px, transparent 1px);
      background-size: 33.33% 33.33%;
    }

    .level-bar {
      position: absolute;
      top: 50%;
      left: 16%;
      right: 16%;
      height: 1px;
      background: rgba(229, 193, 88, 0.55);
      z-index: 2;
      pointer-events: none;
    }

    .dual-pip {
      width: 84px;
      height: 112px;
      border-radius: 14px;
      border: 1.5px solid var(--gold);
      background: linear-gradient(155deg, rgba(229,193,88,0.28), rgba(255,71,105,0.22));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.45);
    }

    .teleprompter-box {
      background: rgba(5, 5, 7, 0.78);
      border: 1px solid var(--gold-border);
      border-radius: 14px;
      padding: 10px 12px;
      font-size: 13px;
      line-height: 1.45;
      color: var(--gold);
      backdrop-filter: blur(8px);
    }

    .shutter-row {
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding: 6px 0;
    }

    .shutter-btn {
      width: 68px;
      height: 68px;
      border-radius: 999px;
      border: 3px solid var(--text-primary);
      background: rgba(255,255,255,0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .shutter-core {
      width: 54px;
      height: 54px;
      border-radius: 999px;
      background: var(--text-primary);
      transition: all 0.15s ease;
    }

    .shutter-btn.recording .shutter-core {
      width: 26px;
      height: 26px;
      border-radius: 8px;
      background: var(--rose);
    }

    .slider-row {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .slider-label {
      display: flex;
      justify-content: space-between;
      font-size: 11.5px;
      color: var(--text-secondary);
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--gold);
      cursor: pointer;
    }

    /* Bottom Navigation */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 460px;
      z-index: 40;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      align-items: center;
      padding: 8px 8px calc(10px + var(--safe-bottom));
      background: rgba(8, 9, 13, 0.92);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid var(--border-subtle);
    }

    .nav-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      font-size: 10.5px;
      font-weight: 600;
      cursor: pointer;
      padding: 4px 0;
    }

    .nav-btn.active {
      color: var(--gold);
    }

    .nav-cam-ring {
      width: 44px;
      height: 44px;
      border-radius: 999px;
      border: 2px solid var(--gold);
      background: var(--gold-soft);
      color: var(--gold);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      margin-top: -12px;
      box-shadow: 0 6px 18px rgba(229, 193, 88, 0.22);
    }

    /* Modal & Toast */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 60;
      background: rgba(0, 0, 0, 0.72);
      backdrop-filter: blur(8px);
      display: none;
      align-items: flex-end;
      justify-content: center;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-sheet {
      width: 100%;
      max-width: 460px;
      max-height: 88dvh;
      overflow-y: auto;
      background: var(--bg-surface);
      border-top-left-radius: 24px;
      border-top-right-radius: 24px;
      border: 1px solid var(--gold-border);
      padding: 18px 16px calc(24px + var(--safe-bottom));
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .toast {
      position: fixed;
      top: calc(64px + var(--safe-top));
      left: 50%;
      transform: translateX(-50%) translateY(-12px);
      max-width: 410px;
      width: calc(100% - 28px);
      z-index: 80;
      background: rgba(18, 20, 28, 0.96);
      border: 1px solid var(--gold-border);
      color: var(--text-primary);
      padding: 10px 14px;
      border-radius: 14px;
      font-size: 12.5px;
      font-weight: 600;
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transition: all 0.22s ease;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .muted {
      color: var(--text-secondary);
      font-size: 12.5px;
      line-height: 1.45;
    }

    .small-muted {
      color: var(--text-muted);
      font-size: 11px;
    }

    .divider {
      height: 1px;
      background: var(--border-subtle);
      margin: 4px 0;
    }
  </style>
</head>

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return structuredClone(DEFAULT_STATE);
        const parsed = JSON.parse(raw);
        return {
          ...structuredClone(DEFAULT_STATE),
          ...parsed,
          currentUser: { ...structuredClone(DEFAULT_STATE.currentUser), ...(parsed.currentUser || {}) },
          supabase: { ...structuredClone(DEFAULT_STATE.supabase), ...(parsed.supabase || {}) },
          camera: {
            ...structuredClone(DEFAULT_STATE.camera),
            ...(parsed.camera || {}),
            beauty: { ...structuredClone(DEFAULT_STATE.camera.beauty), ...((parsed.camera && parsed.camera.beauty) || {}) },
            ai: { ...structuredClone(DEFAULT_STATE.camera.ai), ...((parsed.camera && parsed.camera.ai) || {}) },
            recording: false,
            recordSec: 0
          }
        };
      } catch (e) {
        return structuredClone(DEFAULT_STATE);
      }
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (e) {}
      if (state.supabase && state.supabase.connected && state.supabase.url && state.supabase.anonKey) {
        syncSupabaseSnapshot();
      }
    }

    async function syncSupabaseSnapshot() {
      try {
        const baseUrl = state.supabase.url.replace(/\/+$/, '');
        await fetch(`${baseUrl}/rest/v1/yakin_snapshots`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'apikey': state.supabase.anonKey,
            'Authorization': `Bearer ${state.supabase.anonKey}`,
            'Prefer': 'resolution=merge-duplicates'
          },
          body: JSON.stringify({
            id: state.currentUser.handle,
            user_name: state.currentUser.name,
            updated_at: new Date().toISOString(),
            payload: state
          })
        });
      } catch (e) {}
    }

    function showToast(msg) {
      const el = document.getElementById('toastBox');
      el.textContent = msg;
      el.classList.add('show');
      clearTimeout(showToast._t);
      showToast._t = setTimeout(() => el.classList.remove('show'), 2500);
    }

    function setTab(tab) {
      if (state.activeTab === 'camera' && tab !== 'camera') {
        stopLiveCamera();
      }
      state.activeTab = tab;
      document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.tab === tab);
      });
      saveState();
      render();
      if (tab === 'camera') {
        startLiveCamera(false);
      }
    }

    function getZodiacScore(mySign, otherSign) {
      if (mySign === otherSign) return 86;
      const list = ZODIAC_COMPAT[mySign] || [];
      return list.includes(otherSign) ? 94 : 74;
    }

    function formatRemaining(ms) {
      const diff = Math.max(0, ms - Date.now());
      const mins = Math.floor(diff / 60000);
      const hrs = Math.floor(mins / 60);
      if (hrs > 0) return `${hrs} sa ${mins % 60} dk`;
      return `${Math.max(1, mins)} dk`;
    }

      saveState();
      render();

    function toggleSecretLike(id) {
      const c = state.candidates.find(x => x.id === id);
      if (!c) return;
      c.likedSecret = !c.likedSecret;
      if (c.likedSecret && !state.matchedIds.includes(id)) {
        state.matchedIds.push(id);
        showToast(`${c.name} ile eşleşme oluştu!`);
      } else {
        showToast(c.likedSecret ? 'Gizli beğeni gönderildi' : 'Gizli beğeni geri alındı');
      }
      saveState();
      render();
    }

    function voteThread(id, idx) {
      const t = state.threads.find(x => x.id === id);
      if (!t) return;
      if (t.userVote !== null && t.userVote !== undefined) {
        t.votes[t.userVote] = Math.max(0, (t.votes[t.userVote] || 1) - 1);
      }
      t.userVote = idx;
      t.votes[idx] = (t.votes[idx] || 0) + 1;
      saveState();
      render();
      showToast('Oyun kaydedildi');
    }

    function toggleReelLike(id) {
      const r = state.reels.find(x => x.id === id);
      if (!r) return;
      r.liked = !r.liked;
      r.likes += r.liked ? 1 : -1;
      saveState();
      render();

    function hideItem(collection, id) {
      const arr = state[collection];
      if (!Array.isArray(arr)) return;
      const item = arr.find(x => x.id === id);
      if (!item) return;
      item.hidden = true;
      state.lastUndo = { collection, id };
      saveState();
      render();
      showToast('İçerik gizlendi (Profilde Geri Al aktif)');

    function undoLastAction() {
      if (!state.lastUndo) return;
      const { collection, id } = state.lastUndo;
      const item = (state[collection] || []).find(x => x.id === id);
      if (item) item.hidden = false;
      state.lastUndo = null;
      saveState();
      render();
      showToast('Son işlem geri alındı');
    }

    /* ---------------- CAMERA LOGIC ---------------- */
    async function startLiveCamera(showErr) {
      const videoEl = document.getElementById('liveVideo');
      if (!videoEl || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return;
      stopLiveCamera();
      try {
        mediaStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: state.camera.facing },
          audio: !!state.camera.mic
        });
        videoEl.srcObject = mediaStream;
        await videoEl.play().catch(() => {});
      } catch (err) {
        if (showErr) showToast('Kamera izni verilmedi; sentetik vizör aktif');
      }
    }

    function stopLiveCamera() {
      if (mediaStream) {
        mediaStream.getTracks().forEach(t => t.stop());
        mediaStream = null;
      }
    }

    function switchCamFacing() {
      state.camera.facing = state.camera.facing === 'user' ? 'environment' : 'user';
      saveState();
      render();
      startLiveCamera(false);
    }

    function camToggle(key) {
      state.camera[key] = !state.camera[key];
      saveState();
      render();
      if (key === 'facing' || key === 'mic') startLiveCamera(false);
    }

    function cycleCamTimer() {
      const seq = [0, 3, 10];
      const i = seq.indexOf(state.camera.timer);
      state.camera.timer = seq[(i + 1) % seq.length];
      saveState();
      render();
    }

    function updateBeauty(key, val) { state.camera.beauty[key] = Number(val); saveState(); render(); }
    function toggleBeforeAfter() { state.camera.beauty.beforeAfter = !state.camera.beauty.beforeAfter; saveState(); render(); }

    function oneTapEnhance() {
      state.camera.beauty.smooth = 45;
      state.camera.beauty.relight = 55;
      state.camera.beauty.eyes = 40;

      saveState();
      render();
      showToast('Tek dokunuşla ışık ve denge iyileştirildi');
    }

    function captureSnapshotToDataUrl() {
      const canvas = document.createElement('canvas');
      canvas.width = 480;
      canvas.height = 640;
      const ctx = canvas.getContext('2d');
      const video = document.getElementById('liveVideo');
      if (video && video.readyState >= 2) {
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      } else {
        const g = ctx.createLinearGradient(0, 0, 480, 640);
        g.addColorStop(0, '#2B2108');
        g.addColorStop(0.5, '#17131A');
        g.addColorStop(1, '#050507');
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, 480, 640);
        ctx.fillStyle = '#E5C158';
        ctx.font = 'bold 28px serif';
        ctx.fillText('YAKIN', 190, 320);
      }
      return canvas.toDataURL('image/jpeg', 0.85);
    }

    function triggerShutter() {
      const c = state.camera;
      if (c.mode === 'video') {
        if (!c.recording) {
          c.recording = true;
          c.recordSec = 0;
          recordedChunks = [];
          if (mediaStream && typeof MediaRecorder !== 'undefined') {
            try {
              mediaRecorder = new MediaRecorder(mediaStream);
              mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordedChunks.push(e.data); };
              mediaRecorder.start();
            } catch (e) {}
          }
          recordInterval = setInterval(() => {
            c.recordSec += 1;
            if (c.recordSec >= c.durationSec) {
              triggerShutter();
            }
          }, 1000);
          saveState();
          render();
          showToast('Video kaydı başladı');
        } else {
          c.recording = false;
          clearInterval(recordInterval);
          if (mediaRecorder && mediaRecorder.state !== 'inactive') {
            try { mediaRecorder.stop(); } catch (e) {}
          }
          c.capturedDataUrl = captureSnapshotToDataUrl();
          saveState();
          render();
          showToast(`Video kaydedildi (${c.recordSec || 1} sn)`);
        }
        return;
      }

      c.capturedDataUrl = captureSnapshotToDataUrl();
      saveState();
      render();
      showToast(c.mode === 'text' ? 'Senaryo karesi oluşturuldu' : 'Fotoğraf çekildi');
    }

    function publishCaptured() {
      const c = state.camera;
      const eff = CAMERA_EFFECTS[c.effectIndex % CAMERA_EFFECTS.length];
      const sc = SCENARIOS.find(s => s.id === c.scenarioId) || SCENARIOS[0];
      const caption = c.mode === 'text' ? sc.script : `${state.currentUser.name} • ${c.fps} fps çekim`;

      if (c.mode === 'video') {
        state.reels.unshift({
          id: 'rl_' + Date.now(),
          author: state.currentUser.name,
          zodiac: state.currentUser.zodiac,
          caption,
          effect: `${eff.badge} ${c.fps}fps`,
          likes: 1,
          liked: true,
          hidden: false,
          gradient: 'linear-gradient(160deg, #2A2009, #07080C)'
        });
        state.profileMedia.unshift({
          id: 'pm_' + Date.now(),
          type: 'video',
          title: 'Yeni Video',
          caption,
          visibility: state.currentUser.privacyTier,
          hidden: false,
          gradient: 'linear-gradient(135deg, #2A2009, #090A0D)'
        });
        c.capturedDataUrl = null;
        saveState();
        showToast('Video Reels ve Profil akışında yayınlandı');
        setTab('reels');
      } else {
        state.stories.splice(1, 0, {
          id: 's_' + Date.now(),
          author: state.currentUser.name,
          durationLabel: c.storyDuration,
          caption,
          unlockAt: c.unlockHours > 0 ? Date.now() + c.unlockHours * 3600000 : null,
          hidden: false,
          gradient: 'linear-gradient(145deg, #291F09, #090A0E)'
        });
        state.profileMedia.unshift({
          id: 'pm_' + Date.now(),
          type: 'photo',
          title: 'Yeni Kare',
          caption,
          visibility: state.currentUser.privacyTier,
          hidden: false,
          gradient: 'linear-gradient(135deg, #25111A, #090A0D)'
        });
        c.capturedDataUrl = null;
        saveState();
        showToast(`${c.storyDuration} hikâye ve Profil akışında paylaşıldı`);
        setTab('discover');
      }
    }

    /* ---------------- MESSAGING & DRAFTS ---------------- */
    function sendCustomMessage(peerId) {
      const inp = document.getElementById('msgInput');
      if (!inp || !inp.value.trim()) return;
      sendPresetMessage(peerId, inp.value.trim());
      inp.value = '';
    }

    function sendPresetMessage(peerId, text) {
      state.messages.push({
        id: 'm_' + Date.now(),
        peerId,
        fromMe: true,
        text,
        isRequest: false,
        disappearSec: 0,
        unlockAt: null
      });
      state.messagesSubTab = 'inbox';
      saveState();
      render();
      showToast('Mesaj gönderildi');
    }

    function acceptMessageRequest(id) {
      const m = state.messages.find(x => x.id === id);
      if (m) m.isRequest = false;
      state.messagesSubTab = 'inbox';
      saveState();
      render();
      showToast('Mesaj isteği kabul edildi');
    }

    function declineMessageRequest(id) {
      state.messages = state.messages.filter(x => x.id !== id);
      saveState();
      render();
      showToast('Mesaj isteği reddedildi');
    }

    function publishDraft(id) {
      const idx = state.drafts.findIndex(d => d.id === id);
      if (idx === -1) return;
      const d = state.drafts[idx];
      state.profileMedia.unshift({
        id: 'pm_' + Date.now(),
        type: 'photo',
        title: d.title,
        caption: d.text,
        visibility: state.currentUser.privacyTier,
        hidden: false,
        gradient: 'linear-gradient(135deg, #2A2108, #090A0D)'
      });
      state.drafts.splice(idx, 1);
      saveState();
      render();
      showToast('Taslak profilde yayınlandı');
    }

    /* ---------------- MODALS ---------------- */
    function openModal(html) {
      document.getElementById('modalSheet').innerHTML = html;
      document.getElementById('modalBackdrop').classList.add('open');
    }

    function closeModal() {
      document.getElementById('modalBackdrop').classList.remove('open');
    }

    function handleBackdropClick(e) {
      if (e.target.id === 'modalBackdrop') closeModal();
    }

    function openStoryComposer() {
      openModal(`
        <div class="row-between">
          <div style="font-weight:700;font-size:15px;">Hikâye Oluştur (24s / 48s)</div>
          <button class="icon-btn" onclick="closeModal()">✕</button>
        </div>
        <input class="input" id="stCaption" placeholder="Hikâye notu yaz..." />
        <div class="row-gap">
          <select class="select" id="stDur" style="flex:1;">
            <option value="24s">24 Saat</option>
            <option value="48s">48 Saat</option>
          </select>
          <select class="select" id="stLock" style="flex:1;">
            <option value="0">Hemen Görünür</option>
            <option value="12">12 Saat Sonra Açılır</option>
            <option value="24">24 Saat Sonra Açılır</option>
            <option value="48">48 Saat Sonra Açılır</option>
          </select>
        </div>
        <button class="btn-gold" onclick="submitStory()">Hikâyeyi Paylaş</button>
      `);
    }

    function submitStory() {
      const cap = (document.getElementById('stCaption').value || '').trim() || 'Yeni anı paylaşımı.';
      const dur = document.getElementById('stDur').value;
      const lockHrs = Number(document.getElementById('stLock').value || 0);
      state.stories.splice(1, 0, {
        id: 's_' + Date.now(),
        author: state.currentUser.name,
        durationLabel: dur,
        caption: cap,
        unlockAt: lockHrs > 0 ? Date.now() + lockHrs * 3600000 : null,
        hidden: false,
        gradient: 'linear-gradient(145deg, #271E09, #08090D)'
      });
      saveState();
      closeModal();
      render();
      showToast('Hikâye eklendi');
    }

    function openStoryViewer(id) {
      const s = state.stories.find(x => x.id === id);
      if (!s) return;
      const locked = s.unlockAt && s.unlockAt > Date.now();
      openModal(`
        <div class="row-between">
          <div style="font-weight:700;font-size:15px;">${s.author} • ${s.durationLabel}</div>
          <button class="icon-btn" onclick="closeModal()">✕</button>
        </div>
        <div class="visual-box" style="background:${s.gradient};min-height:180px;">
          <span class="pill active">${locked ? '🔒 Kilitli (' + formatRemaining(s.unlockAt) + ')' : '✦ Açık'}</span>
          <div style="font-size:15px;font-weight:600;">
            ${locked ? 'Bu hikâye belirlenen saat geldiğinde açılacak.' : s.caption}
          </div>
        </div>
        <button class="btn-ghost" onclick="hideItem('stories', '${s.id}');closeModal();">Hikâyeyi Gizle</button>
      `);
    }

    function openThreadComposer() {
      openModal(`
        <div class="row-between">
          <div style="font-weight:700;font-size:15px;">Yeni Gündem &amp; Anket</div>
          <button class="icon-btn" onclick="closeModal()">✕</button>
        </div>
        <input class="input" id="thQuestion" placeholder="Sorunu veya anket başlığını yaz..." />
        <input class="input" id="thQuote" placeholder="Alıntı metni (isteğe bağlı)..." />
        <div class="row-gap">
          <select class="select" id="thGroup" style="flex:1;">
            <option>Kitap</option>
            <option>Müzik</option>
            <option>Moda</option>
            <option>Aşk</option>
          </select>
          <select class="select" id="thDur" style="flex:1;">
            <option value="1s">1 Saat</option>
            <option value="24s">24 Saat</option>
            <option value="3g">3 Gün</option>
          </select>
        </div>
        <button class="btn-gold" onclick="submitThread()">Paylaş</button>
      `);
    }

    function submitThread() {
      const q = (document.getElementById('thQuestion').value || '').trim();
      if (!q) return showToast('Lütfen bir soru yaz');
      state.threads.unshift({
        id: 't_' + Date.now(),
        author: `${state.currentUser.name} • ${state.currentUser.zodiac}`,
        group: document.getElementById('thGroup').value,
        question: q,
        pollDuration: document.getElementById('thDur').value,
        replyPolicy: 'Herkes',
        votes: [1, 1],
        userVote: null,
        chainCount: 1,
        quoted: (document.getElementById('thQuote').value || '').trim(),
        hidden: false
      });
      saveState();
      closeModal();
      render();
      showToast('Anket ve gönderi eklendi');
    }

    function openIcebreaker(peerId) {
      const peer = state.candidates.find(c => c.id === peerId) || state.candidates[0];
      openModal(`
        <div class="row-between">
          <div style="font-weight:700;font-size:15px;">${peer.name} • Buz Kırıcı</div>
          <button class="icon-btn" onclick="closeModal()">✕</button>
        </div>
        <div class="muted">Tek dokunuşla ilk mesajı gönder veya kendi notunu yaz:</div>
        <button class="pill active" onclick="sendPresetMessage('${peer.id}', 'Selam ${peer.name}! ${peer.sharedPlace} civarında favori zamanın ne zaman?');closeModal();">
          ✦ Mekan &amp; Zaman Sorusu Gönder
        </button>
        <button class="pill" onclick="sendPresetMessage('${peer.id}', '${state.currentUser.zodiac} ve ${peer.zodiac} enerjisi sence nasıl bir ikili olur?');closeModal();">
          ☾ Burç Uyumu Sorusu Gönder
        </button>
        <input class="input" id="iceCustom" placeholder="Özel açılış mesajın..." />
        <button class="btn-gold" onclick="sendPresetMessage('${peer.id}', (document.getElementById('iceCustom').value || 'Selam!'));closeModal();">Gönder</button>
      `);
    }

    function openProfileMediaComposer(type) {
      openModal(`
        <div class="row-between">
          <div style="font-weight:700;font-size:15px;">${type === 'video' ? 'Profilde Video Paylaş' : 'Profilde Fotoğraf Paylaş'}</div>
          <button class="icon-btn" onclick="closeModal()">✕</button>
        </div>
        <input class="input" id="pmTitle" placeholder="Başlık (örn. Gece Notu)" />
        <textarea class="textarea" id="pmCaption" placeholder="Açıklama yaz..."></textarea>
        <select class="select" id="pmVis">
          <option value="1-3km">1–3 km Yakın Çevre</option>
          <option value="all">Herkes</option>
        </select>
        <button class="btn-gold" onclick="submitProfileMedia('${type}')">Profilde Yayınla</button>
      `);
    }

    function submitProfileMedia(type) {
      const title = (document.getElementById('pmTitle').value || '').trim() || (type === 'video' ? 'Yeni Video' : 'Yeni Fotoğraf');
      const caption = (document.getElementById('pmCaption').value || '').trim() || 'YAKIN profil paylaşımı.';
      const vis = document.getElementById('pmVis').value;
      state.profileMedia.unshift({
        id: 'pm_' + Date.now(),
        type,
        title,
        caption,
        visibility: vis,
        hidden: false,
        gradient: type === 'video'
          ? 'linear-gradient(135deg, #291F09, #090A0D)'
          : 'linear-gradient(135deg, #25111A, #090A0D)'
      });
      saveState();
      closeModal();
      render();
      showToast(type === 'video' ? 'Video profilde paylaşıldı' : 'Fotoğraf profilde paylaşıldı');
    }

    function openMediaDetail(id) {
      const m = state.profileMedia.find(x => x.id === id);
      if (!m) return;
      openModal(`
        <div class="row-between">
          <div style="font-weight:700;font-size:15px;">${m.title} (${m.type === 'video' ? 'Video' : 'Fotoğraf'})</div>
          <button class="icon-btn" onclick="closeModal()">✕</button>
        </div>
        <div class="visual-box" style="background:${m.gradient};min-height:170px;">
          <span class="pill active">${m.visibility}</span>
          <div style="font-size:14px;">${m.caption}</div>
        </div>
        <button class="btn-rose" onclick="hideItem('profileMedia', '${m.id}');closeModal();">Paylaşımı Gizle</button>
      `);
    }

    function openGoldModal() {
      openModal(`
        <div class="row-between">
          <div style="font-weight:700;font-size:15px;color:var(--gold);">YAKIN Gold • AI &amp; Ayrıcalıklar</div>
          <button class="icon-btn" onclick="closeModal()">✕</button>
        </div>
        <div class="muted">AI yüz/stil dönüşümleri, stüdyo ışığı, arka plan değişimi ve filigransız dışa aktarım.</div>
        <button class="btn-ghost" onclick="activateGold('50 ₺ / Haftalık')">50 ₺ / Haftalık</button>
        <button class="btn-gold" onclick="activateGold('150 ₺ / Aylık (3 Gün Ücretsiz)')">150 ₺ / Aylık • 3 Gün Ücretsiz Deneme</button>
        <button class="btn-ghost" onclick="activateGold('900 ₺ / Yıllık')">900 ₺ / Yıllık</button>
      `);
    }

    function activateGold(plan) {
      state.currentUser.isGold = true;
      state.currentUser.goldPlan = plan;
      state.currentUser.trialUsed = true;
      saveState();
      closeModal();
      render();
      showToast(`${plan} aktif edildi`);
    }

    function openAuthModal() {
      const u = state.currentUser;
      openModal(`
        <div class="row-between">
          <div style="font-weight:700;font-size:15px;">Kayıt Ol / Giriş Yap</div>
          <button class="icon-btn" onclick="closeModal()">✕</button>
        </div>
        <div class="small-muted">Aktif oturum: ${u.name} (${u.method})</div>
        <input class="input" id="authName" value="${u.name}" placeholder="Adın" />
        <select class="select" id="authMethod">
          <option value="Gmail" ${u.method === 'Gmail' ? 'selected' : ''}>Gmail ile Devam Et</option>
          <option value="Telefon" ${u.method === 'Telefon' ? 'selected' : ''}>Telefon (+90) ile Devam Et</option>
        </select>
        <input class="input" id="authContact" value="${u.contact}" placeholder="ornek@gmail.com veya +90 5xx xxx xx xx" />
        <select class="select" id="authZodiac">
          ${Object.keys(ZODIAC_COMPAT).map(z => `<option value="${z}" ${u.zodiac === z ? 'selected' : ''}>${z}</option>`).join('')}
        </select>
        <button class="btn-gold" onclick="submitAuth()">Kaydet ve Giriş Yap</button>
      `);
    }

    function submitAuth() {
      const name = (document.getElementById('authName').value || '').trim() || 'Merve';
      const method = document.getElementById('authMethod').value;
      const contact = (document.getElementById('authContact').value || '').trim() || 'kullanici@yakin.app';
      const zodiac = document.getElementById('authZodiac').value;
      state.currentUser.name = name;
      state.currentUser.method = method;
      state.currentUser.contact = contact;
      state.currentUser.zodiac = zodiac;
      saveState();
      closeModal();
      render();
      showToast(`${name} olarak giriş yapıldı (${method})`);
    }

    function openSupabaseModal() {
      openModal(`
        <div class="row-between">
          <div style="font-weight:700;font-size:15px;">Supabase Bulut Senkronizasyonu</div>
          <button class="icon-btn" onclick="closeModal()">✕</button>
        </div>
        <div class="muted">Yerel hafıza (localStorage) her zaman açıktır. İstersen Supabase Project URL ve anon key girerek buluta da yedekleyebilirsin.</div>
        <input class="input" id="sbUrl" value="${state.supabase.url || ''}" placeholder="https://xxxx.supabase.co" />
        <input class="input" id="sbKey" value="${state.supabase.anonKey || ''}" placeholder="Supabase anon public key" />
        <button class="btn-gold" onclick="saveSupabaseConfig()">Bulut Bağlantısını Kaydet</button>
      `);
    }

    function saveSupabaseConfig() {
      const url = (document.getElementById('sbUrl').value || '').trim();
      const key = (document.getElementById('sbKey').value || '').trim();
      state.supabase.url = url;
      state.supabase.anonKey = key;
      state.supabase.connected = Boolean(url && key);
      saveState();
      closeModal();
      render();
      showToast(state.supabase.connected ? 'Supabase bulut bağlantısı kaydedildi' : 'Yerel kalıcılık (localStorage) aktif');
    }

    function installPwaHint() {
      openModal(`
        <div class="row-between">
          <div style="font-weight:700;font-size:15px;">Telefon Ana Ekranına Ekle</div>
          <button class="icon-btn" onclick="closeModal()">✕</button>
        </div>
        <div class="muted">
          • <strong>Android (Chrome):</strong> Sağ üstteki ⋮ menüsünden <strong>Ana ekrana ekle</strong> seçeneğine dokun.<br/>
          • <strong>iPhone (Safari):</strong> Alt ortadaki <strong>Paylaş</strong> simgesinden <strong>Ana Ekrana Ekle</strong> seçeneğine dokun.
        </div>
        <button class="btn-gold" onclick="closeModal()">Anladım</button>
      `);
    }

    document.getElementById('invisibleTopBtn').addEventListener('click', toggleInvisible);
    document.getElementById('authTopBtn').addEventListener('click', openAuthModal);
    document.getElementById('cloudBtn').addEventListener('click', openSupabaseModal);

    render();
  </script>
</body>
</html>
